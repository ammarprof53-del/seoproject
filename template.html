<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PageTitle}}</title>
  <meta name="description" content="{{Description}}">
  {{Canonical}}
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto max-w-4xl px-5 py-10 sm:px-8 sm:py-16">
    <a href="../" class="inline-block text-sm font-semibold text-teal-300 underline underline-offset-4">All comparisons</a>
    <header class="mt-8 border-b border-slate-700 pb-8">
      <h1 class="text-4xl font-bold tracking-tight sm:text-6xl">{{ToolName}} vs {{Competitor}} <span class="mt-3 block text-2xl font-medium text-teal-300 sm:text-3xl">for {{UseCases}}</span></h1>
    </header>
    <section aria-labelledby="trial" class="mt-8 rounded-2xl border border-slate-700 bg-slate-900 p-6 sm:p-10">
      <h2 id="trial" class="text-2xl font-semibold">Run a side-by-side trial</h2>
      <div class="mt-4 space-y-4 leading-relaxed text-slate-300">
        {{AIGeneratedContent}}
      </div>
    </section>
  </main>
</body>
</html>
